{% extends 'base.html' %}

{% block content %}
<div class="invite-page">
    <h1>You've been invited to join {{ room.name }}!</h1>
    <p>{{ room.description }}</p>
    <img src="{{ room.logo.url }}" alt="{{ room.name }} logo">

    <form method="POST" action="{% url 'accept_invite' room_name=room.name invite_code=invite_code %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Accept Invite</button>
    </form>
</div>
{% endblock %}
