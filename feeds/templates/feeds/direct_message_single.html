<div class="messages-element" style="margin-left: 0px; display: flex; flex-direction: row;">
    <a href="{{ message.sender.profile_url }}">
        <img src="{{ message.sender.profile_pic_url }}" alt="{{ message.sender.username }}'s avatar" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;">
    </a>
    <div>
        <div class="message" style="display: flex; flex-direction: column; align-items: left; margin-bottom: 10px; margin-left: 0px; background: white; border-radius: 20px; padding: 20px; width: 150%;">
            <strong>{{ message.sender.username }}</strong>
            {{ message.text }}
            <br>
            <h6>{{ message.date }}</h6>
        </div>
    </div>
</div>
